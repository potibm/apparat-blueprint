# ---------------------------------------------------------------------------
# Local development infrastructure for the Apparat Blueprint template.
#
# All credentials in this file are WELL-KNOWN DEVELOPMENT DEFAULTS, not
# secrets. They exist so `mise run infra:up` yields a working stack immediately:
#
#   OpenObserve  admin@example.com / password123
#   Dex          admin@example.com / password   (see infra/dex-config.yaml)
#
# Replace every one of them before using any of this outside local development.
# ---------------------------------------------------------------------------
services:
  # --------------------------------------------------------
  # Traefik Reverse Proxy
  # --------------------------------------------------------
  traefik:
    image: traefik:v3.7
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--providers.file.filename=/etc/traefik/dynamic.yaml"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/.certs:/certs:ro
      - ./infra/traefik-dynamic.yaml:/etc/traefik/dynamic.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --------------------------------------------------------
  # Identity
  # --------------------------------------------------------
  dex:
    image: ghcr.io/dexidp/dex:v2.38.0
    volumes:
      - ./infra/dex-config.yaml:/etc/dex/config.docker.yaml
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dex-app.rule=Host(`dex.apparat-blueprint.test`)"
      - "traefik.http.routers.dex-app.entrypoints=websecure"
      - "traefik.http.routers.dex-app.tls=true"
      - "traefik.http.services.dex-app.loadbalancer.server.port=5556"

  # --------------------------------------------------------
  # Observability
  # --------------------------------------------------------
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    environment:
      - ZO_ROOT_USER_EMAIL=admin@example.com
      - ZO_ROOT_USER_PASSWORD=password123
    volumes:
      - o2_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.observe-app.rule=Host(`observe.apparat-blueprint.test`)"
      - "traefik.http.routers.observe-app.entrypoints=websecure"
      - "traefik.http.routers.observe-app.tls=true"
      - "traefik.http.services.observe-app.loadbalancer.server.port=5080"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./infra/otel-config.yaml:/etc/otel/config.yaml
      - ./backend/logs:/etc/app/logs:ro
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "3417:4317" # OTLP gRPC (Needed for Go backend on host)
      - "3418:4318" # OTLP HTTP (Needed for Vite frontend on host)
    depends_on:
      - openobserve

  # --------------------------------------------------------
  # Data Stores
  # --------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: apparat-blueprint_redis
    ports:
      - "3451:6379" # Needed for Go backend on host
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  redisinsight:
    image: redis/redisinsight:latest
    container_name: apparat-blueprint_redisinsight
    environment:
      - RI_APP_PORT=5540
      - RI_APP_HOST=0.0.0.0
      - RI_ACCEPT_TERMS_AND_CONDITIONS=true
      - RI_REDIS_ALIAS0=Apparat-Blueprint-Redis
      - RI_REDIS_HOST0=apparat-blueprint_redis
      - RI_REDIS_PORT0=6379
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redis-app.rule=Host(`redis.apparat-blueprint.test`)"
      - "traefik.http.routers.redis-app.entrypoints=websecure"
      - "traefik.http.routers.redis-app.tls=true"
      - "traefik.http.services.redis-app.loadbalancer.server.port=5540"

volumes:
  o2_data:
  redis_data:
  redisinsight_data:
